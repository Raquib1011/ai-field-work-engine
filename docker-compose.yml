version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: field_work_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: field_work_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - field_network

